# Perfil de cliente ideal (ICP) da Ejota. Ajuste antes de rodar.
# Itens marcados com PREENCHER ainda são sugestões.

servico: "mapeamento de processos"        # PREENCHER: serviço oferecido
ticket: {min: 10000, max: 20000}

cidade: "Rio de Janeiro"

# Cada setor é combinado com cada região numa busca do Google Maps.
# Clínicas aparecem fortes em todas as fontes do estudo de mercado (Etapa 1).
setores:                                  # PREENCHER
  - clínica odontológica
  - clínica médica
  - escritório de advocacia

regioes_prioritarias:                     # PREENCHER
  - Barra da Tijuca
  - Botafogo
  - Copacabana
  - Ipanema
  - Leblon
  - Centro
  - Tijuca
  - Niterói

filtros:
  portes: [ME, EPP]                       # porte na Receita; "DEMAIS" vira alerta, não exclusão
  capital_social_maximo: 10000000         # acima disso, considera empresa grande
  anos_minimos_cnpj: 2
  municipios_aceitos:                     # Região Metropolitana do Rio
    - Rio de Janeiro
    - Niterói
    - São Gonçalo
    - Duque de Caxias
    - Nova Iguaçu
    - Belford Roxo
    - São João de Meriti
    - Mesquita
    - Nilópolis
    - Queimados
    - Japeri
    - Seropédica
    - Itaguaí
    - Paracambi
    - Magé
    - Guapimirim
    - Itaboraí
    - Tanguá
    - Maricá
    - Rio Bonito
    - Cachoeiras de Macacu
    - Petrópolis
  # Número de funcionários (5 a 100) não está em dados públicos: conferir no LinkedIn.

pontuacao:
  capital_social_minimo: 100000           # PREENCHER
  avaliacoes_minimas: 100                 # PREENCHER
  nota_minima: 4.2

max_resultados_por_busca: 20

# Base local com os dados abertos de CNPJ (python -m leadfinder base atualizar).
base_receita: dados/receita.sqlite

# CNAEs de cada setor, usados para descobrir empresas na Receita e desempatar o cruzamento.
cnaes_por_setor:                          # PREENCHER junto com "setores"
  clínica odontológica: ["8630504"]       # atividade odontológica
  clínica médica: ["8630501", "8630502", "8630503"]   # ambulatorial com cirurgia / exames / consultas
  escritório de advocacia: ["6911701"]    # serviços advocatícios              # cada busca custa uma chamada à Places API

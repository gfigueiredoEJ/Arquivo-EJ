<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipê Math</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
</head>
<body>
<header class="toolbar">
  <span class="appname">Ipê Math</span>
  <button id="btn-new" type="button" title="Nova folha em branco">Novo</button>
  <label class="btn" title="Abrir arquivo .ipe">Abrir<input id="file-open" type="file" accept=".ipe,.json" hidden></label>
  <button id="btn-save" type="button" title="Salvar a folha">Salvar</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btn-prompt" type="button" title="Inserir prompt de execução (Ctrl+J)" class="mono">[&gt;</button>
  <button id="btn-text" type="button" title="Inserir texto (Ctrl+T)" class="serif">T</button>
  <button id="btn-run-all" type="button" title="Executar a folha inteira (Ctrl+Shift+Enter)" class="mono">!!!</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="btn-help" type="button" title="Lista de comandos">Ajuda</button>
</header>
<main class="paper">
  <section class="sheet" id="sheet" aria-label="Folha de trabalho"></section>
</main>
<footer class="statusbar"><span class="left"><span id="status">Pronto</span><button id="btn-stop" type="button" hidden title="Interromper o cálculo">■ Interromper</button></span><span class="hint">Enter executa · Shift+Enter nova linha · digite ? para ajuda</span></footer>
<script src="kernel.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipê Math</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">∫</span> Ipê Math <small>álgebra computacional</small></div>
  <nav class="actions">
    <button id="btn-run-all" title="Executar todas as células (Ctrl+Shift+Enter)">▶ Executar tudo</button>
    <button id="btn-add-math">+ Matemática</button>
    <button id="btn-add-text">+ Texto</button>
    <button id="btn-export" title="Salvar planilha como arquivo .ipe">Salvar</button>
    <label class="btn" title="Abrir arquivo .ipe">Abrir<input id="file-open" type="file" accept=".ipe,.json" hidden></label>
    <button id="btn-clear" title="Limpar variáveis e planilha">Nova</button>
    <button id="btn-theme" title="Alternar tema">◐</button>
  </nav>
</header>
<main class="layout">
  <aside class="palette" id="palette"></aside>
  <section class="sheet" id="sheet" aria-label="Planilha"></section>
</main>
<script src="kernel.js"></script>
<script src="app.js"></script>
</body>
</html>
